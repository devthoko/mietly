{% extends request.user.is_authenticated|yesno:"base.html,errors/bare.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card mt" style="max-width:560px;margin:60px auto">
  <div class="empty">
    <div class="empty-icon">{% icon 'compass' 22 %}</div>
    <div class="subtle small">Fehler {{ code }}</div>
    <h3>{{ title }}</h3>
    <p>{{ text }}</p>
    <a class="btn btn-primary" href="/">Zur Übersicht</a>
  </div>
</div>
{% endblock %}
