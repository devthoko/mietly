# mietly – nginx-Konfiguration (wird vom Installer verwaltet)

upstream mietly_app {
    server unix:/run/mietly/gunicorn.sock fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/mietly/tls/mietly.crt;
    ssl_certificate_key /etc/mietly/tls/mietly.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:mietly:10m;

    client_max_body_size 200m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Komprimierung für Text (HTML, CSS, JS, SVG, JSON) – PDFs und Bilder sind bereits komprimiert
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain text/csv;

    # Statische Dateien tragen einen Inhalts-Hash im Namen (ManifestStaticFilesStorage)
    # und ändern sich nie – der Browser darf sie ein Jahr lang ohne Rückfrage verwenden.
    location /static/ {
        alias /opt/mietly/current/staticfiles/;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # Geschützte Dateien: nur nach Freigabe durch die Anwendung (X-Accel-Redirect)
    location /_protected/ {
        internal;
        alias /var/lib/mietly/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_pass http://mietly_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }
}
